[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-tag-edit"
version = "0.1.0"
description = "Edit audio metadata in your text editor, without beets"
requires-python = ">=3.10"
dependencies = ["mutagen>=1.47", "PyYAML>=6"]

[project.optional-dependencies]
binary = ["pyinstaller>=6.16"]

[project.scripts]
tag-edit = "tag_edit:main"

[tool.setuptools]
py-modules = ["tag_edit"]
