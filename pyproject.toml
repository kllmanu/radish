[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radish"
version = "0.1.0"
description = "Edit audio metadata in your text editor, without beets"
requires-python = ">=3.10"
dependencies = ["click>=8.1", "mutagen>=1.47", "PyYAML>=6"]

[project.optional-dependencies]
binary = ["pyinstaller>=6.16"]

[project.scripts]
radish = "radish:cli"

[tool.setuptools]
py-modules = ["radish"]
